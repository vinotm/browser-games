<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser Games</title>
    <meta name="description" content="Play Snake, Sudoku, SOS and Memory in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Browser Games" />
    <meta property="og:title" content="Browser Games" />
    <meta property="og:description" content="Play Snake, Sudoku, SOS and Memory in your browser." />
    <meta property="og:url" content="https://browser-games-7cp.pages.dev/" />
    <meta property="og:image" content="https://browser-games-7cp.pages.dev/shared/social/homepage-v1.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Snake, Sudoku and SOS game graphics on a dark background" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Browser Games" />
    <meta name="twitter:description" content="Play Snake, Sudoku, SOS and Memory in your browser." />
    <meta name="twitter:image" content="https://browser-games-7cp.pages.dev/shared/social/homepage-v1.png" />
    <meta name="twitter:image:alt" content="Snake, Sudoku and SOS game graphics on a dark background" />

    <script src="shared/js/theme-init.js"></script>
    <link rel="stylesheet" href="shared/css/base.css" />
    <link rel="stylesheet" href="shared/css/components.css" />
    <link rel="stylesheet" href="shared/css/home.css" />
  </head>
  <body class="game-page">
    <main class="collection">
      <header class="collection-header" data-page-header data-immediate-theme>
        <h1>Browser Games <span class="collection-beta">beta</span></h1>

      </header>
      <script src="shared/js/theme-button.js"></script>
      <nav class="game-cards" aria-label="Choose a game">
        <a class="game-card snake-card" href="snake-game/">
          <div class="game-art" aria-hidden="true">
            <svg viewBox="0 0 240 144" fill="none">
              <path class="preview-grid" d="M24 24H216M24 48H216M24 72H216M24 96H216M24 120H216M24 24V120M48 24V120M72 24V120M96 24V120M120 24V120M144 24V120M168 24V120M192 24V120M216 24V120"/>
              <path class="preview-snake" d="M60 108V60H108V84H156V60"/>
              <rect class="preview-head" x="146" y="38" width="20" height="22" rx="6"/>
              <circle class="preview-eye" cx="160" cy="44" r="2"/>
              <circle class="preview-food" cx="192" cy="48" r="8"/>
            </svg>
          </div>
          <div class="card-details"><div><h2>Snake <span class="card-beta">beta</span></h2></div></div>
        </a>
        <a class="game-card sudoku-card" href="sudoku-game/">
          <div class="game-art" aria-hidden="true">
            <svg viewBox="0 0 240 144" fill="none">
              <rect class="preview-cell" x="102" y="54" width="36" height="36" rx="4"/>
              <path class="preview-sudoku-grid" d="M66 18H174V126H66ZM102 18V126M138 18V126M66 54H174M66 90H174"/>
              <g class="preview-digits" text-anchor="middle"><text x="84" y="44">1</text><text x="156" y="44">9</text><text x="120" y="80">5</text><text x="84" y="116">7</text><text x="156" y="116">3</text></g>
            </svg>
          </div>
          <div class="card-details"><div><h2>Sudoku <span class="card-beta">beta</span></h2></div></div>
        </a>
        <a class="game-card sos-card" href="sos-game/">
          <div class="game-art" aria-hidden="true">
            <svg viewBox="0 0 240 144" fill="none">
              <path class="preview-sudoku-grid" d="M66 18H174V126H66ZM102 18V126M138 18V126M66 54H174M66 90H174"/>
              <g class="preview-digits" text-anchor="middle"><text class="preview-s" x="84" y="44">S</text><text class="preview-o" x="120" y="80">O</text><text class="preview-s" x="156" y="116">S</text></g>
              <path class="preview-strike" d="M78 30L162 114"/>
            </svg>
          </div>
          <div class="card-details"><div><h2>SOS <span class="card-beta">beta</span></h2></div></div>
        </a>
        <a class="game-card memory-card" href="memory-game/">
          <div class="game-art" aria-hidden="true">
            <svg viewBox="0 0 240 144" fill="none">
              <g stroke="var(--key-border)" stroke-width="1.5">
                <rect x="60" y="18" width="54" height="48" rx="4" fill="var(--board)"/>
                <rect x="126" y="18" width="54" height="48" rx="4" fill="var(--secondary)"/>
                <rect x="60" y="78" width="54" height="48" rx="4" fill="var(--secondary)"/>
                <rect x="126" y="78" width="54" height="48" rx="4" fill="var(--board)"/>
              </g>
              <g fill="var(--primary)"><circle cx="87" cy="42" r="13"/><circle cx="153" cy="102" r="13"/></g>
              <g stroke="var(--muted)" stroke-width="1.5" opacity=".4"><path d="m153 36 6 6-6 6-6-6Z"/><path d="m87 96 6 6-6 6-6-6Z"/></g>
            </svg>
          </div>
          <div class="card-details"><div><h2>Memory <span class="card-beta">beta</span></h2></div></div>
        </a>
      </nav>
    </main>
    <script type="module">
      import { createPageShell } from './shared/js/page-shell.js';
      createPageShell();
    </script>
  </body>
</html>
