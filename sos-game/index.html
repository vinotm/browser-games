<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOS · Browser Games</title>
  <script src="../shared/js/theme-init.js"></script>
  <link rel="stylesheet" href="../shared/css/base.css" />
  <link rel="stylesheet" href="../shared/css/components.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="game-page page-entering">
<main class="game-layout">
  <header class="game-header" data-page-header><span></span><h1>SOS <span class="beta-label">beta</span></h1></header>
  <div class="scoreboard" aria-label="Score"><span id="player-one" class="player-name">P1</span><strong id="score-one">0</strong><span class="score-divider">–</span><strong id="score-two">0</strong><span id="player-two" class="player-name">Computer</span></div>
  <div class="game-screen">
    <div id="board" role="group" aria-label="SOS board"></div>
    <svg id="lines" aria-hidden="true"></svg>
    <section id="setup" class="overlay">
      <label for="mode">Game mode</label>
      <span class="select-wrap"><select id="mode"><option value="computer">vs Computer</option><option value="local">Multiplayers</option></select></span>
      <label for="size">Board size</label>
      <span class="select-wrap"><select id="size"><option value="4">4 × 4</option><option value="6" selected>6 × 6</option><option value="8">8 × 8</option><option value="10">10 × 10</option></select></span>
      <label for="difficulty" id="difficulty-label">Difficulty</label>
      <span class="select-wrap" id="difficulty-wrap"><select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></span>
      <button id="start">Start game</button>
    </section>
    <section id="result" class="overlay" hidden><h2 id="result-title" class="overlay-title"></h2><p id="result-score" class="overlay-detail"></p><button id="again">Play again</button></section>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <dialog id="letter-picker" aria-label="Place a letter"><button class="picker-close" aria-label="Cancel placement">×</button><div class="picker-letters"><button data-letter="S">S</button><button data-letter="O">O</button></div></dialog>
</main>
<script type="module" src="js/game.js"></script>
</body>
</html>
