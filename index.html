<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser Games</title>
    <script src="shared/js/theme-init.js"></script>
    <link rel="stylesheet" href="shared/css/base.css" />
    <link rel="stylesheet" href="shared/css/components.css" />
    <link rel="stylesheet" href="shared/css/home.css" />
  </head>
  <body class="game-page">
    <main class="collection">
      <header class="collection-header" data-page-header>
        <h1>Browser Games <span class="collection-beta">beta</span></h1>

      </header>
      <nav class="game-cards" aria-label="Choose a game">
        <a class="game-card snake-card" href="snake-game/">
          <div class="game-art" aria-hidden="true">
            <svg viewBox="0 0 240 144" fill="none">
              <path class="preview-grid" d="M24 24H216M24 48H216M24 72H216M24 96H216M24 120H216M24 24V120M48 24V120M72 24V120M96 24V120M120 24V120M144 24V120M168 24V120M192 24V120M216 24V120"/>
              <path class="preview-snake" d="M60 108V60H108V84H156V60"/>
              <rect class="preview-head" x="146" y="38" width="20" height="22" rx="6"/>
              <circle class="preview-eye" cx="160" cy="44" r="2"/>
              <circle class="preview-food" cx="192" cy="48" r="8"/>
            </svg>
          </div>
          <div class="card-details"><div><h2>Snake <span class="card-beta">beta</span></h2></div></div>
        </a>
        <a class="game-card sudoku-card" href="sudoku-game/">
          <div class="game-art" aria-hidden="true">
            <svg viewBox="0 0 240 144" fill="none">
              <rect class="preview-cell" x="102" y="54" width="36" height="36" rx="4"/>
              <path class="preview-sudoku-grid" d="M66 18H174V126H66ZM102 18V126M138 18V126M66 54H174M66 90H174"/>
              <g class="preview-digits" text-anchor="middle"><text x="84" y="44">1</text><text x="156" y="44">9</text><text x="120" y="80">5</text><text x="84" y="116">7</text><text x="156" y="116">3</text></g>
            </svg>
          </div>
          <div class="card-details"><div><h2>Sudoku <span class="card-beta">beta</span></h2></div></div>
        </a>
      </nav>
    </main>
    <script type="module">
      import { createPageShell } from './shared/js/page-shell.js';
      createPageShell();
    </script>
  </body>
</html>
